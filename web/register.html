<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - StockandCrypto</title>
    <link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
    <!-- Header Navigation -->
    <header class="header">
        <div class="header-container">
            <div class="logo">
                <a href="index.html" style="display: flex; align-items: center; gap: 0.5rem;">
                    <span class="logo-icon">◈</span>
                    <span class="logo-text">StockandCrypto</span>
                </a>
            </div>
            <nav class="nav">
                <ul class="nav-menu">
                    <li><a href="index.html" class="nav-link">首页</a></li>
                    <li><a href="login.html" class="nav-link">登录</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Register Section -->
    <section class="auth-section">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <h1 class="auth-title">创建账户</h1>
                    <p class="auth-subtitle">加入我们，开启智能投资之旅</p>
                </div>
                
                <form id="registerForm" class="auth-form">
                    <div class="form-group">
                        <label for="username">用户名</label>
                        <input type="text" id="username" name="username" placeholder="请输入用户名" required>
                        <span class="form-error" id="usernameError"></span>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">邮箱地址</label>
                        <input type="email" id="email" name="email" placeholder="请输入邮箱" required>
                        <span class="form-error" id="emailError"></span>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">密码</label>
                        <input type="password" id="password" name="password" placeholder="请输入密码（至少8位）" required minlength="8">
                        <span class="form-error" id="passwordError"></span>
                    </div>
                    
                    <div class="form-group">
                        <label for="confirmPassword">确认密码</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="请再次输入密码" required>
                        <span class="form-error" id="confirmPasswordError"></span>
                    </div>
                    
                    <div class="form-group checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="agreement" required>
                            <span>我已阅读并同意 <a href="#">服务条款</a> 和 <a href="#">隐私政策</a></span>
                        </label>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-full" id="submitBtn">
                        <span>注册账户</span>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M5 12h14M12 5l7 7-7 7"/>
                        </svg>
                    </button>
                </form>
                
                <div class="auth-footer">
                    <p>已有账户？ <a href="login.html">立即登录</a></p>
                </div>
            </div>
            
            <div class="auth-decoration">
                <div class="decoration-content">
                    <div class="decoration-icon">◈</div>
                    <h2>智能量化交易</h2>
                    <p>AI 驱动的市场预测，让投资更简单</p>
                    <ul class="feature-list">
                        <li>✓ 实时市场分析</li>
                        <li>✓ 深度学习预测</li>
                        <li>✓ 策略回测验证</li>
                    </ul>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer footer-minimal">
        <div class="container">
            <div class="footer-bottom" style="border-top: none; padding-top: 0;">
                <p class="copyright">© 2024 StockandCrypto. All rights reserved.</p>
                <div class="footer-legal">
                    <a href="#">隐私政策</a>
                    <a href="#">服务条款</a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
